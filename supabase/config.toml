# Supabase project config consumed by the CLI (`supabase link`, `supabase db push`).
# https://supabase.com/docs/guides/cli/config
project_id = "vm-2026"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# Production site URL — keep in sync with Vercel / custom domain.
site_url = "https://vm-2026-seven.vercel.app"
additional_redirect_urls = [
  "http://localhost:5173",
  "http://localhost:5173/**",
  "https://vm-2026-seven.vercel.app",
  "https://vm-2026-seven.vercel.app/**",
  "https://fridsen.com/**",
  "https://www.fridsen.com/**",
]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# Block new accounts after fn_global_deadline() (hosted + local).
[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/public/hook_reject_signup_after_deadline"

[edge_runtime]
enabled = true
policy = "per_worker"

# Invoked by pg_cron via pg_net without a JWT; only upserts public RSS headlines.
[functions.sync-news]
verify_jwt = false
