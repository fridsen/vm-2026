<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f5f4f9" />
    <meta name="apple-mobile-web-app-title" content="VM-Tipset" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700;800&family=Source+Sans+Pro:wght@600&display=swap"
      rel="stylesheet"
    />
    <title>VM-tipset 2026</title>
  </head>
  <body>
    <div id="root">
      <div
        id="boot-loader"
        style="
          display: flex;
          min-height: 100dvh;
          align-items: center;
          justify-content: center;
          background: #c7ff2e;
          color: #0c162a;
          font-family: 'Barlow', system-ui, sans-serif;
          font-size: 1rem;
          font-weight: 600;
        "
      >
        Laddar…
      </div>
    </div>
    <script>
      (function () {
        var root = document.getElementById('root');
        var reloadKey = 'vm2026:hard-reload';

        function showRecovery(message) {
          if (!root || root.dataset.recovery) return;
          root.dataset.recovery = '1';
          root.innerHTML =
            '<div style="display:flex;min-height:100dvh;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;background:#c7ff2e;color:#0c162a;font-family:system-ui,sans-serif;text-align:center">' +
            '<p style="margin:0;font-size:16px;font-weight:600;max-width:20rem">' +
            message +
            '</p>' +
            '<button type="button" style="border:0;border-radius:999px;background:#0c162a;color:#c7ff2e;padding:12px 20px;font-size:15px;font-weight:700">Ladda om</button>' +
            '</div>';
          root.querySelector('button').addEventListener('click', function () {
            try {
              sessionStorage.setItem(reloadKey, String(Date.now()));
            } catch (e) {}
            var url = new URL(location.href);
            url.searchParams.set('__app_reload', String(Date.now()));
            location.replace(url.toString());
          });
        }

        window.addEventListener(
          'error',
          function (event) {
            if (event.target && event.target.tagName === 'SCRIPT') {
              showRecovery('Appen kunde inte laddas. Prova att ladda om.');
            }
          },
          true,
        );

        window.setTimeout(function () {
          if (document.getElementById('boot-loader')) {
            showRecovery('Laddningen tog för lång tid.');
          }
        }, 12000);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
